<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixel 8 Ball</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    :root { color-scheme: dark; --pink:#ff70a6; --cyan:#67f4e5; --cream:#fff1c7; }
    * { box-sizing:border-box }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; color:var(--cream); background-color:#211d3b; background-image:radial-gradient(#514477 1.5px,transparent 1.5px); background-size:18px 18px; font-family:'Press Start 2P',monospace; text-align:center }
    main { width:min(100%,620px); padding:clamp(22px,6vw,48px); background:#30294e; border:4px solid var(--cream); box-shadow:8px 8px 0 #11101d }
    h1 { margin:0 0 16px; color:var(--pink); font-size:clamp(18px,4vw,27px); line-height:1.6; text-shadow:3px 3px #8b376f }
    .subtitle { margin:0 auto 26px; font-size:9px; line-height:2; color:#c8bedf }
    label { display:block; margin-bottom:12px; font-size:9px; text-align:left }
    input { width:100%; padding:16px 13px; border:3px solid var(--cyan); outline:none; background:#17142b; color:white; font:10px 'Press Start 2P',monospace; line-height:1.7 }
    input:focus { box-shadow:0 0 0 3px #67f4e566 }
    .ball-button { display:block; width:min(72vw,280px); aspect-ratio:1; margin:30px auto 20px; padding:0; border:0; border-radius:50%; cursor:pointer; background:transparent; filter:drop-shadow(8px 10px 0 #11101d); transition:transform .15s }
    .ball-button:hover { transform:translateY(-4px) scale(1.02) }
    .ball-button:active { transform:translateY(2px) }
    .ball { position:relative; display:grid; place-items:center; width:100%; height:100%; overflow:hidden; border:8px solid #08080e; border-radius:50%; background:radial-gradient(circle at 34% 27%,#4b4b5f,#171720 48%,#07070b 78%); box-shadow:inset -14px -14px 0 #0005,inset 10px 10px 0 #ffffff12 }
    .shine { position:absolute; top:16%; left:21%; width:30%; height:11%; background:#ffffff1c; border-radius:50%; transform:rotate(-35deg) }
    .window { position:absolute; left:50%; top:50%; display:grid; place-items:center; width:56%; aspect-ratio:1; padding:20px; background:#151b42; clip-path:polygon(50% 0,100% 88%,0 88%); transform:translate(-50%,-50%); transform-origin:center }
    .window.spinning { animation:spin .9s steps(8,end) infinite }
    @keyframes spin { from { transform:translate(-50%,-50%) rotate(0deg) } to { transform:translate(-50%,-50%) rotate(360deg) } }
    .answer { display:block; width:100%; max-width:115px; margin:18px 0 0; color:var(--cyan); font-size:clamp(6px,1.6vw,9px); line-height:1.7; overflow-wrap:anywhere; text-shadow:2px 2px #090b1d }
    .prompt { min-height:38px; margin:0; color:#c8bedf; font-size:9px; line-height:1.9 }
    .shake { display:inline-block; animation:shake .18s steps(2) 4 }
    @keyframes shake { 25% { transform:translate(4px,-3px) rotate(2deg) } 75% { transform:translate(-4px,3px) rotate(-2deg) } }
    button:focus-visible { outline:3px dashed var(--pink); outline-offset:6px }
    .hint { margin:18px 0 0; color:#a99dbf; font-size:8px; line-height:2 }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; animation-iteration-count:1!important; scroll-behavior:auto!important } }
  </style>
</head>
<body>
  <main>
    <h1>PIXEL 8 BALL</h1>
    <p class="subtitle">ASK THE MYSTERIOUS PIXEL ORB</p>
    <label for="question">TYPE YOUR QUESTION</label>
    <input id="question" maxlength="120" placeholder="Will I find treasure?" autocomplete="off">
    <button class="ball-button" id="ask" type="button" aria-label="Shake the Magic 8 Ball">
      <span class="ball" id="ball"><span class="shine"></span><span class="window" id="window"><span class="answer" id="answer" aria-live="polite">CLICK<br>ME!</span></span></span>
    </button>
    <p class="prompt" id="prompt" aria-live="polite">Click the ball to reveal your answer.</p>
    <p class="hint">PRESS ENTER OR CLICK THE BALL</p>
  </main>
  <script>
    const answers = [
      'Yes - definitely.', 'It is decidedly so.', 'Without a doubt.',
      'Reply hazy, try again.', 'Ask again later.', 'Better not tell you now.',
      'My sources say no.', 'Outlook not so good.', 'Very doubtful.'
    ];
    const input = document.querySelector('#question');
    const ball = document.querySelector('#ball');
    const windowEl = document.querySelector('#window');
    const answerEl = document.querySelector('#answer');
    const prompt = document.querySelector('#prompt');
    const button = document.querySelector('#ask');
    let busy = false;

    function ask() {
      if (busy) return;
      if (!input.value.trim()) {
        prompt.textContent = 'Type a question first, seeker!';
        input.focus();
        ball.classList.remove('shake');
        void ball.offsetWidth;
        ball.classList.add('shake');
        return;
      }
      busy = true;
      button.disabled = true;
      prompt.textContent = 'The pixels are thinking...';
      answerEl.textContent = '???';
      windowEl.classList.add('spinning');
      ball.classList.remove('shake');
      void ball.offsetWidth;
      ball.classList.add('shake');
      window.setTimeout(() => {
        const answer = answers[Math.floor(Math.random() * answers.length)];
        windowEl.classList.remove('spinning');
        answerEl.textContent = answer;
        prompt.textContent = 'The ball has spoken!';
        busy = false;
        button.disabled = false;
      }, 1100);
    }
    button.addEventListener('click', ask);
    input.addEventListener('keydown', event => { if (event.key === 'Enter') ask(); });
  </script>
</body>
</html>
